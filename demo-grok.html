<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>资源池管理 · 界面演示</title>
<style>
  :root {
    --bg: #f5f6f8;
    --ink: #17191f;
    --text: #232733;
    --muted: #667085;
    --faint: #98a2b3;
    --line: #e6e8ee;
    --line-strong: #d7dbe3;
    --accent: #2457d6;
    --accent-ink: #1e4fc7;
    --accent-soft: #e8eefc;
    --good: #067647;
    --good-soft: #e8f8ef;
    --warn: #b54708;
    --warn-soft: #fff6e8;
    --bad: #b42318;
    --bad-soft: #fdecec;
    --shadow: 0 16px 40px rgba(18, 22, 33, .16);
    --sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    background: #fff;
  }
  button, input, select, textarea { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; }
  ::selection { background: #d6e2ff; }

  .shell { height: 100%; display: flex; min-height: 0; }
  .sidenav {
    width: 216px; flex: none; background: #fbfbfc;
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .side-head, .nav-head, .topbar {
    height: 56px; flex: none; border-bottom: 1px solid var(--line);
    display: flex; align-items: center;
  }
  .side-head { gap: 10px; padding: 0 14px; }
  .logo {
    width: 32px; height: 32px; border-radius: 9px; background: #17191f; color: #fff;
    display: grid; place-items: center; font-weight: 700; flex: none;
  }
  .brand { font-weight: 700; font-size: 14px; line-height: 1.2; }
  .brand-sub { font-size: 11px; color: var(--faint); line-height: 1.3; }
  .side-links { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
  .side-label { padding: 4px 10px 6px; font-size: 12px; color: var(--faint); }
  .side-link {
    height: 36px; width: 100%; border: 0; background: transparent; border-radius: 8px;
    display: flex; align-items: center; gap: 10px; padding: 0 10px;
    color: #3a4150; font-size: 13.5px; text-align: left;
  }
  .side-link svg { flex: none; opacity: .75; }
  .side-link:hover { background: #f0f1f4; }
  .side-link.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 650; }
  .side-link.active svg { opacity: 1; }
  .side-foot {
    margin-top: auto; border-top: 1px solid var(--line);
    padding: 12px 14px; display: flex; align-items: center; gap: 10px;
  }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft);
    color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none;
  }

  .nav {
    width: 292px; flex: none; background: #fff; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .nav-head { gap: 8px; padding: 0 12px; }
  .nav-head strong { font-size: 14px; }
  .nav-tools { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .scopes { padding: 0 8px 8px; display: flex; flex-direction: column; gap: 2px; }
  .section-label { padding: 2px 16px 6px; font-size: 12px; color: var(--faint); }
  .pool-scroll { flex: 1; min-height: 0; overflow: auto; padding: 0 8px 16px; }

  .workspace { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: #fff; }
  .topbar { justify-content: space-between; gap: 16px; padding: 0 16px; background: #fff; }
  .top-title { min-width: 0; display: flex; flex-direction: column; }
  .top-title strong { font-size: 14px; line-height: 1.2; }
  .top-title span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-actions { display: flex; align-items: center; gap: 8px; flex: none; }
  .content { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }

  .search {
    display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px;
    border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; color: var(--faint);
  }
  .search input {
    border: 0; outline: none; flex: 1; min-width: 0; width: 100%; height: 100%;
    font: inherit; font-size: 13px; color: var(--ink); background: transparent;
  }
  .search input::placeholder { color: var(--faint); }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(36, 87, 214, .15); }
  .search kbd {
    font-family: inherit; font-size: 11px; color: var(--faint);
    border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px;
    padding: 0 5px; line-height: 16px; background: #fafbfc;
  }
  .search input:not(:placeholder-shown) + kbd,
  .search:focus-within kbd { display: none; }

  .seg { display: flex; padding: 2px; background: #f2f4f7; border-radius: 9px; }
  .seg button {
    flex: 1; height: 26px; border: 0; background: transparent; border-radius: 7px;
    color: #475467; font-size: 12.5px;
  }
  .seg button.on { background: #fff; color: var(--ink); font-weight: 650; box-shadow: 0 1px 2px rgba(16, 24, 40, .08); }
  .toolbar .seg { flex: none; }
  .toolbar .seg button { flex: none; padding: 0 10px; }

  .scope, .pool, .plat {
    width: 100%; border: 0; background: transparent; border-radius: 8px; color: var(--text);
    display: flex; align-items: center; gap: 8px; text-align: left;
  }
  .scope { height: 36px; padding: 0 8px; font-size: 13.5px; }
  .scope .label, .pool .nm, .plat .pn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scope svg { color: #667085; flex: none; }
  .scope:hover, .pool:hover, .plat:hover { background: #f4f6f8; }
  .scope.on, .pool.on { background: var(--accent-soft); color: var(--accent-ink); }
  .scope.on { font-weight: 650; }
  .scope.on svg { color: var(--accent); }
  .plat { height: 30px; padding: 0 8px; margin-top: 6px; color: #667085; font-size: 12.5px; font-weight: 650; }
  .plat .chev { transition: transform .15s ease; color: var(--faint); }
  .plat .chev.collapsed { transform: rotate(-90deg); }
  .pool { min-height: 34px; padding: 0 4px 0 8px; font-size: 13.5px; position: relative; }
  .pool.on .nm { font-weight: 650; }
  .pool .more {
    width: 22px; height: 22px; border: 0; border-radius: 6px; background: transparent;
    color: #667085; display: grid; place-items: center; opacity: 0; flex: none;
  }
  .pool:hover .more, .pool.on .more, .pool .more[aria-expanded="true"] { opacity: 1; }
  .pool .more:hover { background: rgba(16, 24, 40, .06); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #12b76a; flex: none; }
  .dot.off { background: #d0d5dd; }
  .dot.bad { background: #f79009; }
  .count {
    min-width: 20px; height: 18px; padding: 0 6px; border-radius: 999px;
    background: #f2f4f7; color: #475467; font-size: 12px; font-weight: 650;
    display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; flex: none;
  }
  .pool.on .count { background: #d9e4ff; color: var(--accent-ink); }
  .count.bad, .pool.on .count.bad { background: var(--warn-soft); color: var(--warn); }
  .mini {
    font-size: 11px; height: 16px; padding: 0 4px; border-radius: 4px;
    background: #f2f4f7; color: #667085; display: inline-flex; align-items: center; flex: none;
  }
  .mini.rate { color: #6d28d9; background: #f4f0ff; }
  .mark {
    width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
    font-size: 11px; font-weight: 700; flex: none;
    background: color-mix(in srgb, var(--c) 14%, white); color: var(--c);
  }
  .mark.lg { width: 40px; height: 40px; border-radius: 12px; }
  .mark.lg svg { width: 18px; height: 18px; }

  .hero { padding: 16px 20px 12px; flex: none; }
  .hero-id { display: flex; gap: 12px; align-items: flex-start; }
  .title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hero h2 { margin: 0; font-size: 18px; line-height: 1.3; font-weight: 650; }
  .hero-desc { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .callout { margin-top: 10px; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; }
  .callout.warn { background: #fff8ee; color: #93370d; }
  .callout.mute { background: #eef0f3; color: #475467; }
  .hero-bar {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px;
    flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
  }
  .stats { display: flex; gap: 22px; }
  .stat { background: none; border: 0; text-align: left; padding: 0; color: inherit; }
  .stat b { display: block; font-size: 18px; line-height: 1.15; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  .stat b.good { color: var(--good); }
  .stat b.warn { color: var(--warn); }
  .thin { color: var(--faint); font-weight: 500; font-size: 13px; }
  .stat.go { cursor: pointer; border-radius: 8px; padding: 2px 6px; margin: -2px -6px; }
  .stat.go:hover { background: #fff; }
  .hero-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .panel {
    margin: 4px 16px 16px; background: #fff; border: 1px solid var(--line); border-radius: 12px;
    min-height: 0; flex: 1; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
  }
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid var(--line);
  }
  .toolbar .search { flex: 1; min-width: 200px; }
  .select {
    height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-strong);
    background: #fff; display: inline-flex; align-items: center; gap: 6px; color: #344054; font-size: 13px;
  }
  .select:hover, .btn.ghost:hover, .icon-btn:hover { background: #f7f8fa; }
  .result-count { margin-left: auto; color: var(--muted); font-size: 12px; }
  .table-scroll { flex: 1; min-height: 0; overflow: auto; }
  .grid {
    display: grid; align-items: center; column-gap: 10px; padding: 0 12px;
    grid-template-columns: 32px minmax(220px, 1.7fr) 92px 120px minmax(150px, 1.15fr) 96px;
    min-width: 860px;
  }
  #table.in-pool .grid {
    grid-template-columns: 32px minmax(200px, 1.55fr) 92px 116px minmax(140px, 1fr) 112px 96px;
    min-width: 980px;
  }
  #table:not(.in-pool) .prio-col { display: none; }
  .head {
    height: 40px; position: sticky; top: 0; z-index: 2; background: #fbfbfc;
    border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 650;
  }
  .row { min-height: 64px; border-bottom: 1px solid #eef0f3; }
  .row:hover { background: #fafbfc; }
  .row.on { background: #f5f8ff; }
  .row.on:hover { background: #eef3ff; }
  .ops { display: flex; justify-content: flex-end; align-items: center; gap: 2px; }
  .acct { min-width: 0; }
  .line1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .namebtn {
    border: 0; background: none; padding: 0; font-size: 14px; font-weight: 650;
    color: var(--ink); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .namebtn:hover { color: var(--accent); }
  .sub {
    margin-top: 2px; color: var(--faint); font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .idbtn { border: 0; background: none; padding: 0; color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12px; }
  .idbtn:hover { color: var(--accent); }
  .tag {
    height: 18px; padding: 0 5px; border-radius: 4px; background: #f2f4f7; color: #475467;
    font-size: 11px; display: inline-flex; align-items: center; flex: none;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px;
    border-radius: 999px; font-size: 12px; font-weight: 650;
  }
  .badge i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.good { color: var(--good); background: var(--good-soft); }
  .badge.warn { color: var(--warn); background: var(--warn-soft); }
  .badge.bad { color: var(--bad); background: var(--bad-soft); }
  .badge.mute { color: #667085; background: #f2f4f7; }
  .usage-top { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--muted); }
  .usage-top b { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
  .bar { height: 4px; margin-top: 6px; background: #eef0f3; border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .bar i.hot { background: #f79009; }
  .bar i.full { background: #f04438; }
  .chips-btn {
    display: flex; align-items: center; gap: 4px; min-width: 0; max-width: 100%;
    background: transparent; border: 0; padding: 0; text-align: left;
  }
  .chip {
    height: 22px; padding: 0 6px; border-radius: 6px; background: #f2f4f7; color: #344054;
    font-size: 12px; max-width: 148px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    display: inline-flex; align-items: center; flex: none;
  }
  .chip.add {
    width: 22px; padding: 0; justify-content: center; color: var(--accent);
    background: var(--accent-soft); flex: none; font-weight: 700;
  }
  .chip.dashed { background: transparent; color: var(--faint); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .stepper {
    display: inline-flex; align-items: center; border: 1px solid var(--line-strong);
    border-radius: 8px; overflow: hidden; background: #fff;
  }
  .stepper button { width: 22px; height: 26px; border: 0; background: #fff; color: #475467; }
  .stepper button:hover { background: #f4f6f8; }
  .step-val, .prio-input {
    width: 32px; height: 26px; border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line);
    background: #fff; text-align: center; font-variant-numeric: tabular-nums; font-weight: 650; font-size: 13px;
  }
  .prio-input { color: var(--ink); }
  .prio-input:focus { box-shadow: inset 0 0 0 1px var(--accent); }

  .tick {
    width: 16px; height: 16px; border: 1.5px solid #c5cad6; border-radius: 4px;
    display: grid; place-items: center; background: #fff;
  }
  .tick.on, .tick.mixed { background: var(--accent); border-color: var(--accent); }
  .tick.mixed::after { content: ""; width: 8px; height: 1.6px; background: #fff; border-radius: 1px; }
  .tickbtn { width: 28px; height: 28px; border: 0; background: transparent; display: grid; place-items: center; padding: 0; }

  .pager {
    height: 48px; flex: none; border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px;
    color: var(--muted); font-size: 12px;
  }
  .pages { display: flex; align-items: center; gap: 4px; }
  .pages button, .pager select {
    min-width: 28px; height: 28px; padding: 0 8px; border-radius: 7px; border: 0; background: transparent; color: #344054; font-size: 12.5px;
  }
  .pager select { border: 1px solid var(--line); background: #fff; }
  .pages button.on { background: var(--accent); color: #fff; }
  .pages button:hover:not(:disabled):not(.on) { background: #f2f4f7; }
  .pages button:disabled { color: #d0d5dd; cursor: default; }
  .pages .gap { padding: 0 2px; }

  .btn, .icon-btn {
    height: 32px; border-radius: 8px; border: 1px solid transparent; background: #fff;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 13px; padding: 0 12px;
  }
  .btn.sm { height: 28px; padding: 0 8px; font-size: 12px; }
  .btn.ghost, .icon-btn { border-color: var(--line-strong); color: #344054; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-ink); }
  .btn.danger { background: #d92d20; color: #fff; }
  .btn.danger:hover { background: #b42318; }
  .btn.link { border: 0; background: transparent; color: var(--accent); height: 28px; padding: 0 8px; }
  .btn.link:hover { background: var(--accent-soft); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .icon-btn { width: 32px; padding: 0; }
  .icon-btn.bare { border: 0; background: transparent; }
  .icon-btn.bare:hover { background: #f2f4f7; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px;
    border-radius: 999px; background: #f2f4f7; color: #475467; font-size: 12px; font-weight: 650;
  }
  .pill .dot { width: 6px; height: 6px; }
  .pill.good { background: var(--good-soft); color: var(--good); }
  .pill.mute { background: #f2f4f7; color: #667085; }
  .pill.rate { background: #f4f0ff; color: #6d28d9; }
  .demo-pill { font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 8px; font-weight: 650; }

  .empty { padding: 48px 16px; text-align: center; }
  .empty h3 { margin: 8px 0 4px; font-size: 15px; font-weight: 650; }
  .empty p { margin: 0 auto 12px; max-width: 380px; color: var(--muted); font-size: 13px; }
  .empty-mark {
    width: 40px; height: 40px; margin: 0 auto; border-radius: 12px; background: #f2f4f7;
    color: #667085; display: grid; place-items: center;
  }
  .empty-actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .mini-empty { padding: 28px 8px; }
  .mini-empty p { margin-bottom: 8px; }

  .selbar {
    position: fixed; z-index: 40; left: 50%; bottom: 76px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px; max-width: calc(100vw - 32px); flex-wrap: wrap;
    padding: 8px 8px 8px 14px; background: #1b1e27; color: #fff; border-radius: 14px;
    box-shadow: 0 12px 40px rgba(16, 18, 24, .28);
  }
  body.has-sel .table-scroll { padding-bottom: 64px; }
  body.modal-open .selbar { visibility: hidden; }
  .sel-count {
    min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: #fff; color: #17191f;
    display: inline-grid; place-items: center; font-weight: 700; font-size: 12px;
  }
  .selbar .vdiv { width: 1px; height: 16px; background: rgba(255,255,255,.16); }
  .selbar .btn.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.18); }
  .selbar .btn.ghost:hover { background: rgba(255,255,255,.08); }
  .selbar .btn.primary { background: #fff; color: #17191f; }
  .selbar .btn.primary:hover { background: #f2f4f7; }

  #float { position: fixed; z-index: 70; }
  .menu, .popover {
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow);
  }
  .menu { min-width: 180px; padding: 6px; }
  .menu button {
    width: 100%; height: 32px; border: 0; background: transparent; border-radius: 7px;
    padding: 0 10px; text-align: left; font-size: 13px; color: var(--text);
  }
  .menu button:hover { background: #f4f6f8; }
  .menu button.on { color: var(--accent); font-weight: 650; }
  .menu button.danger, .menu button.danger:hover { color: var(--bad); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px; }
  .popover { width: 280px; padding: 12px; }
  .pop-title { font-weight: 650; font-size: 13px; }
  .pop-sub { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }
  .pop-list { max-height: 240px; overflow: auto; }
  .pop-foot, .sheet-foot { display: flex; justify-content: flex-end; gap: 8px; }
  .pop-foot { margin-top: 10px; }

  .overlay {
    position: fixed; inset: 0; z-index: 50; background: rgba(18, 21, 28, .45);
    display: flex; animation: fade .15s ease;
  }
  .overlay.modal { align-items: center; justify-content: center; padding: 24px; }
  .overlay.drawer { justify-content: flex-end; }
  .sheet, .drawer-sheet { background: #fff; display: flex; flex-direction: column; min-height: 0; }
  .sheet { width: min(480px, 100%); max-height: min(760px, calc(100vh - 48px)); border-radius: 16px; box-shadow: var(--shadow); animation: pop .16s ease; }
  .sheet.w-560 { width: min(560px, 100%); }
  .drawer-sheet { width: min(460px, 100vw); height: 100%; box-shadow: -12px 0 40px rgba(16, 18, 24, .12); animation: slide .18s ease; }
  .drawer-sheet.wide { width: min(520px, 100vw); }
  .sheet-head { padding: 16px 16px 8px 20px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .sheet-head > div { min-width: 0; flex: 1; }
  .sheet h3 { margin: 0; font-size: 16px; font-weight: 650; }
  .sheet-head p, .hint { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }

const upstreamCatalog = [
  { name: 'Claude Pro', platform: 'anthropic', addable: true, desc: '官方高优先级分组' },
  { name: 'Claude Team', platform: 'anthropic', addable: true, exists: true, desc: '团队共享额度' },
  { name: 'GPT-4o 生产', platform: 'openai', addable: true, desc: '生产密钥' },
  { name: '内部灰度', platform: 'unknown', addable: false, desc: '平台暂不支持' }
];

const $ = (id) => document.getElementById(id);
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function shortRate(rate) {
  return Number(rate).toFixed(2).replace(/0$/, '').replace(/\.0$/, '') + 'x';
}
function currentPool() { return pools.find((p) => p.id === state.groupId) || null; }
function poolOf(id) { return pools.find((p) => p.id === id); }
function members(poolId) { return accounts.filter((a) => a.groups.includes(poolId)); }
function badCount(list) { return list.filter((a) => a.status === 'limited' || a.status === 'error').length; }
function mark(platform, large) {
  const p = platforms[platform];
  if (!p) return '';
  return `<span class="mark${large ? ' lg' : ''}" style="--c:${p.color}">${esc(p.short)}</span>`;
}
function tick(on, mixed) {
  if (mixed) return '<span class="tick mixed"></span>';
  if (on) return `<span class="tick on">${ICO.check}</span>`;
  return '<span class="tick"></span>';
}
function toast(message, type) {
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'bad' ? ' bad' : '');
  el.textContent = message;
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), 2400);
}
function positionToasts() {
  const lift = state.selected.size > 0 && $('overlay').hidden;
  $('toasts').style.bottom = lift ? '136px' : '20px';
}

function scopeAccounts() {
  if (state.scope === 'group') return accounts.filter((a) => a.groups.includes(state.groupId));
  if (state.scope === 'ungrouped') return accounts.filter((a) => a.groups.length === 0);
  return accounts.slice();
}
function currentAccounts() {
  let list = scopeAccounts();
  const q = state.q.trim().toLowerCase();
  if (q) list = list.filter((a) => `${a.name} ${a.notes} ${a.id}`.toLowerCase().includes(q));
  if (state.platform) list = list.filter((a) => a.platform === state.platform);
  if (state.status) list = list.filter((a) => a.status === state.status);
  if (state.type) list = list.filter((a) => a.type === state.type);
  if (state.scope === 'group') {
    list.sort((a, b) => (a.priority[state.groupId] || 999) - (b.priority[state.groupId] || 999) || a.name.localeCompare(b.name));
  } else {
    const rank = { error: 0, limited: 1, inactive: 2, active: 3 };
    list.sort((a, b) => rank[a.status] - rank[b.status] || a.name.localeCompare(b.name));
  }
  return list;
}
function hasFilters() {
  return Boolean(state.q || state.platform || state.status || state.type);
}

function visiblePools() {
  const q = state.poolQ.trim().toLowerCase();
  return pools.filter((p) => {
    if (q && !`${p.name} ${p.desc} ${platforms[p.platform].full}`.toLowerCase().includes(q)) return false;
    const list = members(p.id);
    const bad = badCount(list) > 0;
    if (state.poolFilter === 'active' && p.status !== 'active') return false;
    if (state.poolFilter === 'issue' && p.status === 'active' && !bad) return false;
    return true;
  }).sort((a, b) => platformOrder.indexOf(a.platform) - platformOrder.indexOf(b.platform) || a.sort - b.sort || a.id - b.id);
}

function renderNav() {
  $('nav-count').textContent = String(pools.length);
  document.querySelectorAll('#pool-seg button').forEach((b) => b.classList.toggle('on', b.dataset.value === state.poolFilter));
  const all = accounts.length;
  const free = accounts.filter((a) => a.groups.length === 0).length;
  $('scopes').innerHTML = `
    <button type="button" class="scope ${state.scope === 'all' ? 'on' : ''}" data-act="go-all">
      ${ICO.grid}<span class="label">全部账号</span><span class="count">${all}</span>
    </button>
    <button type="button" class="scope ${state.scope === 'ungrouped' ? 'on' : ''}" data-act="go-ungrouped">
      ${ICO.inbox}<span class="label">未分组</span><span class="count ${free ? 'bad' : ''}">${free}</span>
    </button>`;

  const list = visiblePools();
  if (!list.length) {
    $('pool-list').innerHTML = `<div class="empty mini-empty"><p>${state.poolQ || state.poolFilter !== 'all' ? '没有符合条件的资源池' : '还没有资源池'}</p><button type="button" class="btn ghost sm" data-act="clear-pool-filter">${state.poolQ || state.poolFilter !== 'all' ? '清空条件' : '新建资源池'}</button></div>`;
    if (!(state.poolQ || state.poolFilter !== 'all')) {
      $('pool-list').querySelector('button').dataset.act = 'create-pool';
    }
    return;
  }
  const forceOpen = state.poolQ.trim() !== '';
  const groups = [];
  list.forEach((p) => {
    let bucket = groups.find((g) => g.platform === p.platform);
    if (!bucket) { bucket = { platform: p.platform, items: [] }; groups.push(bucket); }
    bucket.items.push(p);
  });
  $('pool-list').innerHTML = groups.map((g) => {
    const open = forceOpen || !state.collapsed.has(g.platform);
    const rows = g.items.map((p) => {
      const mem = members(p.id);
      const bad = badCount(mem);
      const dot = bad ? 'bad' : p.status === 'active' ? '' : 'off';
      const active = state.scope === 'group' && state.groupId === p.id;
      return `<div class="pool ${active ? 'on' : ''}" data-act="open-pool" data-id="${p.id}" role="button" tabindex="0" title="${esc(p.desc)}">
        <i class="dot ${dot}"></i>
        <span class="nm">${esc(p.name)}</span>
        ${p.status !== 'active' ? '<span class="mini">停用</span>' : ''}
        ${Number(p.rate) !== 1 ? `<span class="mini rate">${shortRate(p.rate)}</span>` : ''}
        <span class="count ${bad ? 'bad' : ''}" title="${bad ? bad + ' 个账号需要关注' : mem.length + ' 个账号'}">${mem.length}</span>
        <button type="button" class="more" data-act="pool-menu" data-id="${p.id}" aria-label="资源池操作">${ICO.more}</button>
      </div>`;
    }).join('');
    return `<button type="button" class="plat" data-act="toggle-plat" data-platform="${g.platform}">
      ${mark(g.platform)}<span class="pn">${esc(platforms[g.platform].full)}</span><span class="count">${g.items.length}</span>
      ${ICO.chev.replace('class="chev"', `class="chev${open ? '' : ' collapsed'}"`)}
    </button>${open ? rows : ''}`;
  }).join('');
}

function stat(value, label, tone) {
  return `<div class="stat"><b class="${tone || ''}">${value}</b><span>${label}</span></div>`;
}
function renderHero() {
  const pool = state.scope === 'group' ? currentPool() : null;
  const list = state.scope === 'group' && !pool ? [] : (state.scope === 'group' ? members(pool.id) : state.scope === 'ungrouped' ? accounts.filter((a) => !a.groups.length) : accounts);
  const total = list.length;
  const ok = list.filter((a) => a.status === 'active').length;
  const bad = badCount(list);
  const badTone = bad ? 'warn' : '';
  let title, desc, icon, pills, stats, actions, callout = '';
  if (pool) {
    title = pool.name;

    icon = mark(pool.platform, true);
    pills = `
      <span class="pill ${pool.status === 'active' ? 'good' : 'mute'}"><i class="dot ${pool.status === 'active' ? '' : 'off'}"></i>${pool.status === 'active' ? '启用' : '停用'}</span>
      <span class="pill">${esc(platforms[pool.platform].full)}</span>
      <span class="pill rate">${shortRate(pool.rate)}</span>`;
    const cur = list.reduce((s, a) => s + a.current, 0);
    const max = list.reduce((s, a) => s + a.max, 0);
    stats = stat(total, '账号') + stat(ok, '可用', 'good') + stat(bad, '需关注', badTone) + stat(`${cur}<span class="thin">/${max}</span>`, '并发占用');
    actions = `
      <button type="button" class="btn ghost" data-act="edit-pool" data-id="${pool.id}">编辑</button>
      <button type="button" class="btn ghost" data-act="advanced" data-id="${pool.id}">高级配置</button>

    if (pool.status !== 'active') callout = '<div class="callout mute">此资源池已停用。账号会保留，但不会参与调度。</div>';
  } else if (state.scope === 'ungrouped') {
    title = '未分组账号';
    desc = '这些账号还不能被请求路由到。';
    icon = `<span class="mark lg" style="--c:#b54708">${ICO.inbox}</span>`;
    pills = '';
    const plats = new Set(list.map((a) => a.platform)).size;
    stats = stat(total, '待分配', total ? 'warn' : '') + stat(ok, '可用', 'good') + stat(bad, '需关注', badTone) + stat(plats, '涉及平台');
    actions = `<button type="button" class="btn primary" data-act="create-account">新建账号</button>`;
    if (total) callout = '<div class="callout warn">勾选账号后，用屏幕底部的操作条把它们加入资源池。</div>';
  } else {
    title = '全部账号';

    icon = `<span class="mark lg" style="--c:#2457d6">${ICO.grid}</span>`;
    pills = '';
    const free = accounts.filter((a) => !a.groups.length).length;
    stats = stat(total, '账号') + stat(ok, '可用', 'good') + stat(bad, '需关注', badTone)
      + `<button type="button" class="stat go" data-act="go-ungrouped"><b class="${free ? 'warn' : ''}">${free}</b><span>未分组</span></button>`;
    actions = `
      <button type="button" class="btn ghost" data-act="create-pool">新建资源池</button>
      <button type="button" class="btn primary" data-act="create-account">新建账号</button>`;
  }
  $('hero').innerHTML = `
    <div class="hero-id">${icon}<div style="min-width:0">

    <div class="hero-bar"><div class="stats">${stats}</div><div class="hero-actions">${actions}</div></div>`;
}

function accountCells(a) {
  const meta = healthMeta[a.status];
  const tip = a.status === 'limited' ? (a.recover || '频率受限') : a.status === 'error' ? (a.notes || '最近一次调用失败') : '';
  const pct = a.max ? Math.min(100, Math.round(a.current / a.max * 100)) : 0;
  const hot = pct >= 100 ? 'full' : pct >= 80 ? 'hot' : '';
  const names = a.groups.map((id) => poolOf(id)?.name).filter(Boolean);
  const shown = names.slice(0, 1).map((n) => `<span class="chip">${esc(n)}</span>`).join('');
  const extra = names.length > 1 ? `<span class="chip">+${names.length - 1}</span>` : '';
  const empty = names.length ? '' : '<span class="chip dashed">未加入</span>';
  const bits = [`<button type="button" class="idbtn" data-act="copy" data-value="${a.id}">#${a.id}</button>`];
  bits.push(`<span>${esc(a.proxy || '直连')}</span>`);
  if (a.notes) bits.push(`<span title="${esc(a.notes)}">${esc(a.notes)}</span>`);
  let priority = '';
  if (state.scope === 'group') {
    const value = a.priority[state.groupId] || 1;
    priority = state.editingPriority === a.id
      ? `<div class="stepper prio-col"><input class="prio-input" data-prio-input="${a.id}" data-act="noop" value="${value}" inputmode="numeric" /></div>`
      : `<div class="stepper prio-col" title="数字越小越优先">
          <button type="button" data-act="prio" data-id="${a.id}" data-dir="-1" title="提前调度" aria-label="提前调度">↑</button>
          <button type="button" class="step-val" data-act="prio-edit" data-id="${a.id}" title="点击直接修改">${value}</button>
          <button type="button" data-act="prio" data-id="${a.id}" data-dir="1" title="延后调度" aria-label="延后调度">↓</button>
        </div>`;
  }
  return `
    <button type="button" class="tickbtn" data-act="toggle-row" data-id="${a.id}" aria-label="选择 ${esc(a.name)}">${tick(state.selected.has(a.id))}</button>
    <div class="acct">
      <div class="line1">${state.scope === 'group' ? '' : mark(a.platform)}<button type="button" class="namebtn" data-act="open-account" data-id="${a.id}">${esc(a.name)}</button><span class="tag">${typeLabel[a.type]}</span></div>
      <div class="sub">${bits.join(' · ')}</div>
    </div>
    <div><span class="badge ${meta.tone}" ${tip ? `title="${esc(tip)}"` : ''}><i></i>${meta.label}</span></div>
    <div>
      <div class="usage-top"><span>并发</span><b>${a.current} / ${a.max}</b></div>
      <div class="bar"><i class="${hot}" style="width:${pct}%"></i></div>
    </div>
    <button type="button" class="chips-btn" data-act="edit-groups" data-id="${a.id}" title="${esc(names.join('、') || '编辑所属资源池')}">${empty}${shown}${extra}<span class="chip add">+</span></button>
    ${priority}
    <div class="ops">
      <button type="button" class="btn link" data-act="test" data-id="${a.id}">测试</button>
      <button type="button" class="icon-btn bare" data-act="row-menu" data-id="${a.id}" aria-label="更多操作">${ICO.more}</button>
    </div>`;
}

function renderTable() {
  $('table').classList.toggle('in-pool', state.scope === 'group');
  document.querySelectorAll('#status-seg button').forEach((b) => b.classList.toggle('on', b.dataset.value === state.status));
  $('f-platform-label').textContent = state.platform ? platforms[state.platform].full : '全部平台';
  $('f-type-label').textContent = state.type ? typeLabel[state.type] : '全部类型';
  $('f-reset').hidden = !hasFilters();
  const base = scopeAccounts();
  const list = currentAccounts();
  $('result-count').textContent = hasFilters() ? `匹配 ${list.length} / ${base.length}` : '';
  const pages = Math.max(1, Math.ceil(list.length / state.pageSize));
  if (state.page > pages) state.page = pages;
  const startIdx = (state.page - 1) * state.pageSize;
  const rows = list.slice(startIdx, startIdx + state.pageSize);
  const pageIds = rows.map((a) => a.id);
  const allOn = pageIds.length > 0 && pageIds.every((id) => state.selected.has(id));
  const some = pageIds.some((id) => state.selected.has(id));
  $('thead').innerHTML = `<div class="grid head">
    <button type="button" class="tickbtn" data-act="select-page" aria-label="选择本页">${tick(allOn, some && !allOn)}</button>
    <span>账号</span><span>健康</span><span>并发</span><span>所属资源池</span>
    <span class="prio-col" title="数字越小，调度时越优先">优先级</span>
    <span class="ops">操作</span>
  </div>`;
  if (!rows.length) {
    const filtered = hasFilters();
    $('tbody').innerHTML = `<div class="empty">
      <div class="empty-mark">${ICO.inbox}</div>
      <h3>${filtered ? '没有符合筛选的账号' : (state.scope === 'group' ? '这个资源池还没有账号' : '这里还没有账号')}</h3>
      <p>${filtered ? '可以放宽条件，或清空后重新找。' : '从已有账号里添加，或新建一个账号直接放进来。'}</p>
      <div class="empty-actions">
        ${filtered ? '<button type="button" class="btn ghost" data-act="reset-filters">重置筛选</button>' : `
          ${state.scope === 'group' ? '<button type="button" class="btn primary" data-act="add-existing">添加已有账号</button>' : ''}
          <button type="button" class="btn ${state.scope === 'group' ? 'ghost' : 'primary'}" data-act="create-account">新建账号</button>`}
      </div>
    </div>`;
  } else {
    $('tbody').innerHTML = rows.map((a) => `<div class="grid row ${state.selected.has(a.id) ? 'on' : ''}" data-act="toggle-row" data-id="${a.id}">${accountCells(a)}</div>`).join('');
    if (state.editingPriority) {
      requestAnimationFrame(() => {
        const el = document.querySelector('[data-prio-input]');
        if (el && document.activeElement !== el) { el.focus(); el.select(); }
      });
    }
  }
  const start = list.length ? startIdx + 1 : 0;
  const end = Math.min(list.length, startIdx + state.pageSize);
  const nums = [...new Set([1, pages, state.page - 1, state.page, state.page + 1])].filter((i) => i >= 1 && i <= pages).sort((a, b) => a - b);
  let pagesHtml = '';
  let prev = 0;
  nums.forEach((i) => {
    if (prev && i - prev > 1) pagesHtml += '<span class="gap">…</span>';
    pagesHtml += `<button type="button" data-act="page" data-value="${i}" class="${i === state.page ? 'on' : ''}">${i}</button>`;
    prev = i;
  });
  $('pager').innerHTML = `
    <span>${start}–${end} 条，共 ${list.length} 条</span>
    <div class="pages">
      <select id="page-size" aria-label="每页条数">
        <option value="10" ${state.pageSize === 10 ? 'selected' : ''}>10 条/页</option>
        <option value="20" ${state.pageSize === 20 ? 'selected' : ''}>20 条/页</option>
        <option value="50" ${state.pageSize === 50 ? 'selected' : ''}>50 条/页</option>
      </select>
      <button type="button" data-act="page" data-value="${state.page - 1}" ${state.page === 1 ? 'disabled' : ''}>上一页</button>
      ${pagesHtml}
      <button type="button" data-act="page" data-value="${state.page + 1}" ${state.page === pages ? 'disabled' : ''}>下一页</button>
    </div>`;
  renderSelbar();
}

function renderSelbar() {
  const bar = $('selbar');
  const n = state.selected.size;
  document.body.classList.toggle('has-sel', n > 0);

  if (!n) { bar.hidden = true; bar.innerHTML = ''; return; }
  bar.hidden = false;
  bar.innerHTML = `
    <span class="sel-count">${n}</span><span>已选</span><i class="vdiv"></i>
    <button type="button" class="btn primary" data-act="batch-add">加入资源池</button>

    <button type="button" class="btn danger" data-act="batch-delete" title="永久删除账号">删除</button>
    <button type="button" class="btn ghost" data-act="clear-selection">取消</button>`;
}

function updateAll() {
  closeFloat();
  renderNav();
  renderHero();
  renderTable();
}
function go(scope, groupId) {
  state.scope = scope;
  state.groupId = groupId ?? null;
  state.page = 1;
  state.selected.clear();
  state.anchor = null;
  state.editingPriority = null;

}

function closeFloat() {
  $('float').hidden = true;
  $('float').innerHTML = '';
  document.querySelectorAll('[aria-expanded="true"]').forEach((el) => el.removeAttribute('aria-expanded'));
}
function openFloatNear(anchor, html, align) {
  const float = $('float');
  float.hidden = false;
  float.innerHTML = html;
  const r = anchor.getBoundingClientRect();
  const w = float.offsetWidth;
  const h = float.offsetHeight;
  let left = align === 'right' ? r.right - w : r.left;
  let top = r.bottom + 6;
  if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
  left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
  float.style.left = left + 'px';
  float.style.top = top + 'px';
}
function closeOverlay() {
  $('overlay').hidden = true;
  $('overlay').innerHTML = '';
  $('overlay').className = 'overlay';
  document.body.classList.remove('modal-open');
  positionToasts();
}
function openOverlay(kind, html) {
  const overlay = $('overlay');
  overlay.hidden = false;
  overlay.className = 'overlay ' + kind;
  overlay.innerHTML = html;
  document.body.classList.add('modal-open');
  positionToasts();
}
function ask(opts) {
  closeFloat();
  state.onConfirm = opts.ok;
  openOverlay('modal', `<div class="sheet">
    <div class="sheet-head"><div><h3>${esc(opts.title)}</h3></div>
      <button type="button" class="icon-btn bare" data-act="close" aria-label="关闭">${ICO.x}</button></div>
    <div class="sheet-body"><p style="margin:8px 0 12px">${esc(opts.text)}</p></div>
    <div class="sheet-foot">
      <button type="button" class="btn ghost" data-act="close">取消</button>
      <button type="button" class="btn ${opts.danger ? 'danger' : 'primary'}" data-act="confirm-ok">${esc(opts.confirm)}</button>
    </div>
  </div>`);
}
function openAlert(title, text) {
  closeFloat();
  openOverlay('modal', `<div class="sheet">
    <div class="sheet-head"><div><h3>${esc(title)}</h3></div>
      <button type="button" class="icon-btn bare" data-act="close" aria-label="关闭">${ICO.x}</button></div>
    <div class="sheet-body"><p style="margin:8px 0 12px">${esc(text)}</p></div>
    <div class="sheet-foot"><button type="button" class="btn primary" data-act="close">知道了</button></div>
  </div>`);
}
function menuHtml(items) {
  return `<div class="menu">${items.map((it) => it === '|' ? '<hr />' : `<button type="button" class="${it.danger ? 'danger' : ''} ${it.on ? 'on' : ''}" data-act="${it.act}" data-id="${it.id ?? ''}" data-value="${esc(it.value ?? '')}">${esc(it.label)}</button>`).join('')}</div>`;
}
function toggleMenu(el, html) {
  const was = el.getAttribute('aria-expanded') === 'true';
  closeFloat();
  if (was) return;
  el.setAttribute('aria-expanded', 'true');
  openFloatNear(el, html, 'right');
}

function platformSelect(selected, disabled) {
  return `<select class="field" name="platform" ${disabled ? 'disabled' : ''}>${platformOrder.map((k) => `<option value="${k}" ${k === selected ? 'selected' : ''}>${esc(platforms[k].full)}</option>`).join('')}</select>`;
}
function groupChecks(platform, selected) {

}
function applyPrio(id, raw) {
  if (state.scope !== 'group') { state.editingPriority = null; return; }
  const a = accounts.find((x) => x.id === Number(id));
  if (!a) return;
  const prev = a.priority[state.groupId] || 1;
  let n = parseInt(raw, 10);
  if (!Number.isFinite(n)) n = prev;
  n = Math.max(1, Math.min(9999, n));
  a.priority[state.groupId] = n;
  state.editingPriority = null;
  if (n !== prev) toast('优先级已保存');
  renderTable();
}
async function copyText(text) {
  const value = String(text);
  try { await navigator.clipboard.writeText(value); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = value;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  toast('已复制 ' + value);
}

function connOptions(selected) {
  return `<option value="">选择已保存的连接，或直接填写</option>` + connections.map((c) => `<option value="${c.id}" ${c.id === selected ? 'selected' : ''}>${esc(c.base)}</option>`).join('');
}
function openUpstream() {
  closeFloat();
  openOverlay('drawer', `<div class="drawer-sheet wide">
    <div class="sheet-head"><div><h3>上游导入</h3><p>凭据只留在这次演示里，刷新页面就会消失，不会送到服务器。</p></div>
      <button type="button" class="icon-btn bare" data-act="close" aria-label="关闭">${ICO.x}</button></div>
    <div class="drawer-body">
      <label class="field-label">已保存的连接</label>
      <div class="model-row">
        <select class="field" id="up-conn">${connOptions('')}</select>
        <button type="button" class="btn ghost" id="del-conn" data-act="del-conn" disabled>删除</button>
      </div>
      <label class="field-label">Base URL</label>
      <input class="field" id="up-url" placeholder="https://upstream.example.com" autocomplete="off" />
      <label class="field-label">JWT Access Token</label>
      <input class="field" id="up-token" type="password" placeholder="上游登录后的 Access Token" autocomplete="off" />
      <div style="display:flex;justify-content:flex-end;margin-top:12px">
        <button type="button" class="btn primary" id="probe-btn" data-act="probe">探测分组</button>
      </div>
      <div id="up-body"></div>
    </div>
  </div>`);
  renderUpstreamBody();
}
function renderUpstreamBody() {
  const box = $('up-body');
  if (!box) return;
  if (!state.probed) { box.innerHTML = '<p class="hint">填写连接信息后点击「探测分组」。</p>'; return; }
  const prefix = $('up-prefix')?.value ?? 'pool-';
  box.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:18px">
      <strong style="font-size:13px">上游分组</strong>
      <span class="hint" style="margin:0">${upstreamCatalog.length} 个 · 已选 ${state.upPick.size} 个</span>
    </div>
    <div class="picklist">
      ${upstreamCatalog.map((g, i) => {
        const disabled = !g.addable || g.exists;
        const label = g.exists ? '已添加' : g.addable ? '可添加' : '不可添加';
        const tone = g.exists ? 'mute' : g.addable ? 'good' : 'bad';
        return `<button type="button" class="pick" data-act="up-pick" data-value="${i}" ${disabled ? 'disabled' : ''}>
          ${tick(g.exists || state.upPick.has(i))}
          <span class="grow"><b>${esc(g.name)}</b><span class="sub">${esc(g.desc)}</span></span>
          <span class="badge ${tone}">${label}</span>
        </button>`;
      }).join('')}
    </div>
    <label class="field-label">账号名称前缀</label>
    <input class="field" id="up-prefix" value="${esc(prefix)}" placeholder="例如 pool-" />
    <div style="display:flex;justify-content:flex-end;margin-top:12px">
      <button type="button" class="btn primary" data-act="import-up" ${state.upPick.size ? '' : 'disabled'}>添加账号</button>
    </div>`;
}
function probeUpstream() {
  const url = $('up-url').value.trim();
  const token = $('up-token').value.trim();
  if (!/^https?:\/\//i.test(url)) { toast('Base URL 需要以 http:// 或 https:// 开头', 'bad'); return; }
  if (token.length < 8) { toast('请填写 Access Token', 'bad'); return; }
  const btn = $('probe-btn');
  btn.disabled = true;
  btn.textContent = '探测中…';
  setTimeout(() => {
    const found = connections.find((c) => c.base === url);
    if (found) found.token = token;
    else connections.push({ id: 'c' + Date.now(), base: url, token });
    const sel = $('up-conn');
    const current = connections.find((c) => c.base === url);
    if (sel) sel.innerHTML = connOptions(current.id);
    const del = $('del-conn');
    if (del) del.disabled = false;
    state.probed = true;
    state.upPick = new Set();
    if (btn) { btn.disabled = false; btn.textContent = '探测分组'; }
    renderUpstreamBody();
    toast('已获取 4 个上游分组，连接保存在本次演示中');
  }, 500);
}

function selectedIds() { return [...state.selected]; }
function onAction(el, e) {
  const act = el.dataset.act;
  const id = Number(el.dataset.id);
  switch (act) {
    case 'noop': return;
    case 'soon': toast(el.dataset.name + ' 不在这次界面演示里'); return;
    case 'refresh': closeFloat(); toast('列表已刷新'); return;
    case 'go-all': go('all'); return;
    case 'go-ungrouped': go('ungrouped'); return;
    case 'open-pool': go('group', id); return;
    case 'pool-filter': state.poolFilter = el.dataset.value; renderNav(); return;
    case 'toggle-plat': {
      const p = el.dataset.platform;
      if (state.collapsed.has(p)) state.collapsed.delete(p); else state.collapsed.add(p);
      renderNav(); return;
    }
    case 'clear-pool-filter':
      state.poolQ = ''; state.poolFilter = 'all'; $('pool-q').value = ''; renderNav(); return;
    case 'create-pool': openPoolForm(null); return;
    case 'pool-menu':
      toggleMenu(el, menuHtml([
        { act: 'edit-pool', id, label: '编辑' },
        { act: 'advanced', id, label: '高级配置' },
        { act: 'duplicate-pool', id, label: '复制' },
        '|',
        { act: 'delete-pool', id, label: '删除资源池', danger: true }
      ]));
      return;
    case 'edit-pool': openPoolForm(id); return;
    case 'advanced': openAdvanced(id); return;
    case 'duplicate-pool': {
      closeFloat();
      const pool = poolOf(id);
      const next = seq.pool++;
      pools.push({ ...pool, id: next, name: pool.name + ' 副本', models: pool.models.slice(), sort: pool.sort + 1 });
      go('group', next);
      toast('已复制资源池，账号不会一起复制');
      return;
    }
    case 'delete-pool': {
      const pool = poolOf(id);
      ask({
        title: '删除资源池',
        text: `删除「${pool.name}」只会解除归属，账号本身不会删除。`,
        confirm: '删除',
        danger: true,
        ok: () => {
          accounts.forEach((a) => {
            a.groups = a.groups.filter((g) => g !== id);
            delete a.priority[id];
          });
          const idx = pools.findIndex((p) => p.id === id);
          if (idx >= 0) pools.splice(idx, 1);
          if (state.groupId === id) { state.scope = 'all'; state.groupId = null; }
          updateAll();
          toast('资源池已删除');
        }
      });
      return;
    }
    case 'set-status': state.status = el.dataset.value; state.page = 1; renderTable(); return;
    case 'open-platform':
      openFloatNear(el, menuHtml([{ act: 'set-platform', value: '', label: '全部平台', on: !state.platform }].concat(platformOrder.map((k) => ({ act: 'set-platform', value: k, label: platforms[k].full, on: state.platform === k })))), 'left');
      return;
    case 'set-platform': state.platform = el.dataset.value; state.page = 1; closeFloat(); renderTable(); return;
    case 'open-type':
      openFloatNear(el, menuHtml([
        { act: 'set-type', value: '', label: '全部类型', on: !state.type },
        { act: 'set-type', value: 'oauth', label: 'OAuth', on: state.type === 'oauth' },
        { act: 'set-type', value: 'apikey', label: 'API Key', on: state.type === 'apikey' },
        { act: 'set-type', value: 'setup-token', label: 'Setup Token', on: state.type === 'setup-token' },
        { act: 'set-type', value: 'upstream', label: '上游', on: state.type === 'upstream' }
      ]), 'left');
      return;
    case 'set-type': state.type = el.dataset.value; state.page = 1; closeFloat(); renderTable(); return;
    case 'reset-filters':
      state.q = ''; state.platform = ''; state.status = ''; state.type = ''; state.page = 1;
      $('q').value = ''; renderTable(); return;
    case 'page': state.page = Number(el.dataset.value); renderTable(); return;
    case 'select-page': {
      const list = currentAccounts();
      const pageIds = list.slice((state.page - 1) * state.pageSize, state.page * state.pageSize).map((a) => a.id);
      const allOn = pageIds.length && pageIds.every((pid) => state.selected.has(pid));
      pageIds.forEach((pid) => allOn ? state.selected.delete(pid) : state.selected.add(pid));
      renderTable(); return;
    }
    case 'toggle-row': {
      if (e.shiftKey) { e.preventDefault(); window.getSelection()?.removeAllRanges(); }
      const list = currentAccounts().map((a) => a.id);
      if (e.shiftKey && state.anchor != null) {
        const a = list.indexOf(state.anchor);
        const b = list.indexOf(id);
        if (a >= 0 && b >= 0) {
          const [s, t] = a < b ? [a, b] : [b, a];
          for (let i = s; i <= t; i++) state.selected.add(list[i]);
          renderTable(); return;
        }
      }
      if (state.selected.has(id)) state.selected.delete(id); else state.selected.add(id);
      state.anchor = id;
      renderTable(); return;
    }
    case 'edit-groups': closeFloat(); editGroups(id, el); return;
    case 'close-float': closeFloat(); return;
    case 'save-groups': {
      const groups = [...$('float').querySelectorAll('input[type="checkbox"]:checked')].map((i) => Number(i.value));
      applyGroups(el.dataset.id, groups); return;
    }
    case 'prio': {
      const a = accounts.find((x) => x.id === id);
      const cur = a.priority[state.groupId] || 1;
      a.priority[state.groupId] = Math.max(1, Math.min(9999, cur + Number(el.dataset.dir)));
      renderTable(); return;
    }
    case 'prio-edit': state.editingPriority = id; renderTable(); return;
    case 'test': openTest(id); return;
    case 'row-menu':
      toggleMenu(el, menuHtml([
        { act: 'open-account', id, label: '查看详情' },
        { act: 'copy-name', id, label: '复制名称' },
        { act: 'duplicate-account', id, label: '复制账号' },
        '|',
        ...(state.scope === 'group' ? [{ act: 'remove-one', id, label: '移出此池' }, '|'] : []),
        { act: 'delete-one', id, label: '删除账号', danger: true }
      ]));
      return;
    case 'open-account': openAccount(id); return;
    case 'copy': copyText(el.dataset.value); return;
    case 'copy-name': closeFloat(); copyText(accounts.find((a) => a.id === id)?.name || ''); return;
    case 'duplicate-account': {
      closeFloat();
      const a = accounts.find((x) => x.id === id);
      accounts.push({ ...a, id: seq.account++, name: a.name + '-copy', groups: a.groups.slice(), priority: { ...a.priority }, current: 0 });
      updateAll(); toast('已复制账号'); return;
    }
    case 'remove-one': removeIds([id]); return;
    case 'delete-one': deleteIds([id]); return;
    case 'add-existing': openAssign(); return;
    case 'create-account': openCreateAccount(); return;
    case 'batch-add': openBatchAdd(); return;
    case 'batch-remove': removeIds(selectedIds()); return;
    case 'batch-delete': deleteIds(selectedIds()); return;
    case 'clear-selection': state.selected.clear(); renderTable(); return;
    case 'confirm-ok': {
      const fn = state.onConfirm; state.onConfirm = null; closeOverlay(); if (fn) fn(); return;
    }
    case 'close': closeOverlay(); closeFloat(); return;
    case 'set-rate': {
      const input = $('rate-input');
      if (input) input.value = el.dataset.value;
      el.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === el));
      return;
    }
    case 'pick': {
      if (state.pick.has(id)) state.pick.delete(id); else state.pick.add(id);
      renderAssignList(); return;
    }
    case 'pick-all': {
      const pool = poolOf(state.assignPoolId);
      const q = state.assignQ.trim().toLowerCase();
      const vis = accounts.filter((a) => a.platform === pool.platform && !a.groups.includes(pool.id) && (!q || `${a.name} ${a.notes}`.toLowerCase().includes(q)));
      const allOn = vis.length && vis.every((a) => state.pick.has(a.id));
      vis.forEach((a) => allOn ? state.pick.delete(a.id) : state.pick.add(a.id));
      renderAssignList(); return;
    }
    case 'assign-ok': {
      const poolId = state.assignPoolId;
      const ids = [...state.pick];
      ids.forEach((pid) => {
        const a = accounts.find((x) => x.id === pid);
        if (!a.groups.includes(poolId)) { a.groups.push(poolId); a.priority[poolId] = 1; }
      });
      closeOverlay(); updateAll(); toast(`已添加 ${ids.length} 个账号`); return;
    }
    case 'batch-ok': {
      const poolId = Number($('batch-pool').value);
      let added = 0, skip = 0;
      state.batchIds.forEach((pid) => {
        const a = accounts.find((x) => x.id === pid);
        if (a.groups.includes(poolId)) { skip++; return; }
        a.groups.push(poolId); a.priority[poolId] = 1; added++;
      });
      state.selected.clear();
      closeOverlay(); updateAll();
      toast(skip ? `已加入 ${added} 个，${skip} 个原本就在该池` : `已加入 ${added} 个账号`);
      return;
    }
    case 'probe': probeUpstream(); return;
    case 'del-conn': {
      const cid = $('up-conn').value;
      if (!cid) return;
      const item = connections.find((c) => c.id === cid);
      ask({
        title: '删除保存的连接',
        text: `删除「${item.base}」。只影响这次演示。`,
        confirm: '删除',
        danger: true,
        ok: () => {
          connections = connections.filter((c) => c.id !== cid);
          openUpstream();
          toast('已删除保存的连接');
        }
      });
      return;
    }
    case 'up-pick': {
      const i = Number(el.dataset.value);
      if (state.upPick.has(i)) state.upPick.delete(i); else state.upPick.add(i);
      renderUpstreamBody(); return;
    }
    case 'import-up': {
      const prefix = ($('up-prefix')?.value || '').trim();
      if (!prefix) { toast('请填写名称前缀', 'bad'); return; }
      const chosen = [...state.upPick].map((i) => upstreamCatalog[i]).filter((g) => g && g.addable && !g.exists);
      chosen.forEach((g, i) => {
        g.exists = true;
        accounts.push(acc(seq.account++, `${prefix}${g.platform}-${i + 1}`, g.platform, 'upstream', 'active', 0, 4, [], {}, '', `来自上游分组 ${g.name}`));
      });
      state.upPick.clear();
      closeOverlay();
      go('ungrouped');
      toast(`已创建 ${chosen.length} 个账号，先放在未分组`);
      return;
    }
    case 'del-model':
      state.draftModels = state.draftModels.filter((m) => m !== el.dataset.model);
      renderModelChips(); return;
    default: return;
  }
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (el) { onAction(el, e); return; }
  if (!$('float').hidden && !e.target.closest('#float')) closeFloat();
});
$('overlay').addEventListener('click', (e) => { if (e.target === $('overlay')) closeOverlay(); });
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { state.q = e.target.value; state.page = 1; renderTable(); }
  if (e.target.id === 'pool-q') { state.poolQ = e.target.value; renderNav(); }
  if (e.target.id === 'assign-q') { state.assignQ = e.target.value; renderAssignList(); }
  if (e.target.id === 'up-url' || e.target.id === 'up-token') {
    if (state.probed) { state.probed = false; state.upPick.clear(); renderUpstreamBody(); }
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'page-size') { state.pageSize = Number(e.target.value); state.page = 1; renderTable(); }
  if (e.target.id === 'routing-toggle') { const box = $('routing-box'); if (box) box.hidden = !e.target.checked; }
  if (e.target.id === 'up-conn') {
    const c = connections.find((x) => x.id === e.target.value);
    $('del-conn').disabled = !c;
    if (!c) return;
    $('up-url').value = c.base;
    $('up-token').value = c.token;
    state.probed = false;
    state.upPick.clear();
    renderUpstreamBody();
  }
});
document.addEventListener('submit', (e) => {
  if (e.target.id === 'pool-form') { e.preventDefault(); savePool(e.target); }
  if (e.target.id === 'account-form') { e.preventDefault(); saveAccount(e.target); }
  if (e.target.id === 'advanced-form') { e.preventDefault(); saveAdvanced(e.target); }
});
document.addEventListener('focusout', (e) => {
  if (!e.target.matches?.('[data-prio-input]')) return;
  if (skipPrioBlur) { skipPrioBlur = false; return; }
  const pid = e.target.dataset.prioInput;
  const value = e.target.value;
  setTimeout(() => applyPrio(pid, value), 0);
});
document.addEventListener('keydown', (e) => {
  if (e.target.id === 'model-add' && e.key === 'Enter') {
    e.preventDefault();
    const v = e.target.value.trim();
    if (!v) return;
    if (!state.draftModels.includes(v)) state.draftModels.push(v);
    e.target.value = '';
    renderModelChips();
    return;
  }
  if (e.target.matches?.('[data-prio-input]') && (e.key === 'Enter' || e.key === 'Escape')) {
    e.preventDefault();
    skipPrioBlur = true;
    if (e.key === 'Enter') applyPrio(e.target.dataset.prioInput, e.target.value);
    else { state.editingPriority = null; renderTable(); }
    return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList?.contains('pool')) {
    e.preventDefault();
    go('group', Number(e.target.dataset.id));
    return;
  }
  if (e.key === 'Escape') {
    if (!$('float').hidden) { closeFloat(); return; }
    if (!$('overlay').hidden) { closeOverlay(); return; }
  }
  if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const tag = document.activeElement?.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    e.preventDefault();
    $('q').focus();
  }
});
document.addEventListener('contextmenu', (e) => {
  const pool = e.target.closest('.pool');
  if (!pool || e.target.closest('.more')) return;
  e.preventDefault();
  closeFloat();
  openFloatNear(pool, menuHtml([
    { act: 'edit-pool', id: pool.dataset.id, label: '编辑' },
    { act: 'advanced', id: pool.dataset.id, label: '高级配置' },
    { act: 'duplicate-pool', id: pool.dataset.id, label: '复制' },
    '|',
    { act: 'delete-pool', id: pool.dataset.id, label: '删除资源池', danger: true }
  ]), 'left');
  $('float').style.left = Math.min(e.clientX, window.innerWidth - 200) + 'px';
  $('float').style.top = Math.min(e.clientY, window.innerHeight - 180) + 'px';
});

updateAll();
</script>
</body>
</html>
